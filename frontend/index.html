<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chat with your database using natural language." />
    <title>SQL Agent</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="/" aria-label="SQL Agent home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <ellipse cx="12" cy="5" rx="7" ry="3"></ellipse>
              <path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5"></path>
              <path d="M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path>
            </svg>
          </span>
          <span>SQL Agent</span>
        </a>
        <div class="header-meta">
          <button id="connectionButton" class="connection-button" type="button" aria-haspopup="dialog">
            <span id="connectionStatus" class="connection-status"><i></i> PostgreSQL</span>
            <span class="chevron" aria-hidden="true">⌄</span>
          </button>
        </div>
      </header>

      <main id="conversation" class="conversation" aria-live="polite">
        <section id="welcome" class="welcome">
          <div class="welcome-mark" aria-hidden="true">✦</div>
          <h1>How can I help with your data?</h1>
          <p>Ask a question, explore your schema, generate SQL, or run a database query.</p>
          <div class="starter-grid" aria-label="Example questions">
            <button class="starter" data-prompt="What tables are available in my database?">
              <span>Explore schema</span>
              <small>What tables are available?</small>
            </button>
            <button class="starter" data-prompt="Show the top 10 customers by total revenue">
              <span>Analyze data</span>
              <small>Find my top customers</small>
            </button>
            <button class="starter" data-prompt="Explain what a database index is and when I should use one">
              <span>Ask a question</span>
              <small>Explain database indexes</small>
            </button>
            <button class="starter" data-prompt="Write a SQL query to find duplicate email addresses">
              <span>Generate SQL</span>
              <small>Find duplicate records</small>
            </button>
          </div>
        </section>

        <div id="messages" class="messages"></div>
        <div id="conversationEnd" aria-hidden="true"></div>
      </main>

      <footer class="composer-region">
        <form id="chatForm" class="composer">
          <textarea
            id="chatInput"
            rows="1"
            aria-label="Message SQL Agent"
            placeholder="Ask anything about your data..."
            autocomplete="off"
          ></textarea>
          <button id="sendButton" class="send-button" type="submit" aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5"></path>
              <path d="m6 11 6-6 6 6"></path>
            </svg>
          </button>
        </form>
        <p class="composer-hint">SQL Agent can make mistakes. Review generated SQL before running it.</p>
      </footer>
    </div>

    <dialog id="connectionDialog" class="connection-dialog">
      <form id="connectionForm" class="connection-form">
        <header class="dialog-header">
          <div>
            <h2>Connect a database</h2>
            <p>Use saved backend settings, a URI, or individual credentials.</p>
          </div>
          <button id="closeConnectionButton" class="dialog-close" type="button" aria-label="Close connection dialog">×</button>
        </header>

        <label class="field">
          <span>Database type</span>
          <select id="databaseType">
            <option value="postgresql">PostgreSQL</option>
            <option value="mysql">MySQL</option>
            <option value="mssql">Microsoft SQL Server</option>
            <option value="mongodb">MongoDB</option>
          </select>
        </label>

        <label class="field">
          <span>Connection URI <small>optional</small></span>
          <input id="connectionUri" type="password" placeholder="postgresql://user:password@host:5432/database" autocomplete="off" />
        </label>

        <div class="field-grid">
          <label class="field">
            <span>Host</span>
            <input id="databaseHost" type="text" placeholder="localhost" autocomplete="off" />
          </label>
          <label class="field port-field">
            <span>Port</span>
            <input id="databasePort" type="number" placeholder="5432" />
          </label>
        </div>

        <label class="field">
          <span>Database name</span>
          <input id="databaseName" type="text" placeholder="my_database" autocomplete="off" />
        </label>

        <div class="field-grid">
          <label class="field">
            <span>Username</span>
            <input id="databaseUsername" type="text" autocomplete="username" />
          </label>
          <label class="field">
            <span>Password</span>
            <input id="databasePassword" type="password" autocomplete="current-password" />
          </label>
        </div>

        <label id="mongoAuthSourceField" class="field hidden">
          <span>Authentication database</span>
          <input id="mongoAuthSource" type="text" value="admin" />
        </label>

        <label id="mssqlDriverField" class="field hidden">
          <span>ODBC driver</span>
          <input id="mssqlDriver" type="text" value="ODBC Driver 17 for SQL Server" />
        </label>

        <p id="connectionFeedback" class="connection-feedback" role="status"></p>
        <div class="dialog-actions">
          <button id="cancelConnectionButton" class="dialog-button secondary" type="button">Cancel</button>
          <button id="testConnectionButton" class="dialog-button" type="submit">Connect</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
